{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}

{% if data._error %}
<div class="alert error">Could not read the host: {{ data._error }}</div>
{% endif %}

<div class="grid">
	<section class="card" id="panel-health"
	         hx-get="/panels/health" hx-trigger="load, every 10s" hx-swap="innerHTML">
		<h2>Health</h2><p class="muted">loading…</p>
	</section>

	<section class="card" id="panel-version"
	         hx-get="/panels/version" hx-trigger="load, every 30s" hx-swap="innerHTML">
		<h2>Version</h2><p class="muted">loading…</p>
	</section>

	<section class="card wide" id="panel-containers"
	         hx-get="/panels/containers" hx-trigger="load, every 10s" hx-swap="innerHTML">
		<h2>Containers</h2><p class="muted">loading…</p>
	</section>
</div>

{% endblock %}
