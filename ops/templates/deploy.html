{% extends "base.html" %}
{% block title %}Deploy{% endblock %}
{% block content %}

<div class="grid">
	<section class="card wide" id="panel-actions"
	         hx-get="/panels/actions" hx-trigger="load, every 60s" hx-swap="innerHTML">
		<h2>Actions</h2><p class="muted">loading…</p>
	</section>

	<section class="card wide" id="panel-jobs"
	         hx-get="/panels/jobs" hx-trigger="load, every 15s" hx-swap="innerHTML">
		<h2>Jobs</h2><p class="muted">loading…</p>
	</section>
</div>

{% endblock %}
