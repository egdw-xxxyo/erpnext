<form class="card"
      hx-post="/remote/push/{{ name }}"
      hx-headers='{"x-csrf-token": "{{ session.csrf }}"}'
      hx-target="#console-slot"
      hx-swap="innerHTML">
	<h3>Push {{ name }}</h3>
	{% if targets %}
	<div class="alert warn">Uploads this backup set to the selected off-host FTP target.</div>
	<label>Target
		<select name="target_id" required>
			{% for t in targets %}
			<option value="{{ t.id }}">{{ t.name }} ({{ t.env_label }}) — {{ t.host }}</option>
			{% endfor %}
		</select>
	</label>
	<button type="submit" class="primary">Push</button>
	{% else %}
	<div class="alert error">No FTP target configured — see Configuration.</div>
	{% endif %}
</form>
