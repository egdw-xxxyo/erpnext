# Asset origin of one release. Runs from the release image and serves the asset
# tree built into it — hashed bundles, images, icons, node_modules — straight
# from the image, so nothing is copied. The frontend proxies /assets here; which
# release it asks is the $frappe_assets line of nginx-target/target.conf.
server {
	listen 8080;
	server_name _;

	location = /nginx_status {
		stub_status;
		access_log off;
		allow 127.0.0.1;
		deny all;
	}

	location /assets/ {
		alias /home/frappe/frappe-bench/assets/;
	}

	location / {
		return 404;
	}

	sendfile on;
	keepalive_timeout 15;
}
