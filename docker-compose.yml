name: docker

# Which image each service runs comes from .env, written by ./deploy (see ENV_FILE
# there). The defaults are the moving tag, so a host without .env behaves as before.
x-images:
  blue: &image_blue ${ERPNEXT_IMAGE_BLUE:-erpnext-uk:v16.31.1}
  frontend: &image_frontend ${ERPNEXT_IMAGE_FRONTEND:-erpnext-uk:v16.31.1}

services:
  backend:
    image: *image_blue
    networks:
      - frappe_network
    restart: unless-stopped
    # gunicorn gets 25s to finish in-flight requests on SIGTERM (start.sh has no
    # knob for it, GUNICORN_CMD_ARGS does); compose waits 30s before SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - -m
        - "5"
        - -H
        - "Host: frontend"
        - http://127.0.0.1:8000/api/method/ping
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 120s
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:-}
      GUNICORN_CMD_ARGS: --graceful-timeout=25

  configurator:
    image: *image_blue
    networks:
      - frappe_network
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: *image_blue
    networks:
      - frappe_network
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        bench new-site --mariadb-user-host-login-scope='%' --admin-password=admin --db-root-username=root --db-root-password=admin --install-app erpnext --set-default frontend;

  db:
    image: mariadb:10.6
    networks:
      - frappe_network
    healthcheck:
      test: mysqladmin ping -h localhost --password=admin
      interval: 1s
      retries: 20
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: *image_frontend
    networks:
      - frappe_network
    depends_on:
      - websocket
    restart: unless-stopped
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "8080:8080"

  queue-long:
    image: *image_blue
    networks:
      - frappe_network
    restart: unless-stopped
    # `bench worker` finishes its current job on SIGTERM; the 10s default killed
    # long jobs mid-transaction on every deploy.
    stop_grace_period: 300s
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

  queue-short:
    image: *image_blue
    networks:
      - frappe_network
    restart: unless-stopped
    # `bench worker` finishes its current job on SIGTERM; the 10s default killed
    # long jobs mid-transaction on every deploy.
    stop_grace_period: 300s
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    restart: unless-stopped

  scheduler:
    image: *image_blue
    networks:
      - frappe_network
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  websocket:
    image: *image_blue
    networks:
      - frappe_network
    restart: unless-stopped
    stop_grace_period: 15s
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
      FRAPPE_BACKEND_URL: http://backend:8000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  # Cloudflare Tunnel for public HTTPS (WhatsApp Cloud API webhook, etc.).
  # Only starts when the "tunnel" compose profile is active — the deploy script
  # enables it automatically when a .tunnel.env with TUNNEL_TOKEN is present.
  # Ingress (hostname -> http://frontend:8080) is configured remotely in the
  # Cloudflare Zero Trust dashboard; the token identifies the tunnel.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    networks:
      - frappe_network
    restart: unless-stopped
    depends_on:
      - frontend
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

  # HTTPS for devices on the VPN. Only starts when the "tls" compose profile is
  # active — the deploy script enables it when .tls.env has TLS_DOMAIN. The cert
  # comes from Let's Encrypt via Cloudflare DNS-01, so the host needs outbound
  # internet but no inbound exposure. Router: tools/traefik/dynamic.yml.
  traefik:
    image: traefik:v3.3
    profiles:
      - tls
    networks:
      - frappe_network
    restart: unless-stopped
    depends_on:
      - frontend
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=600s
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --log.level=INFO
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
    volumes:
      - ./tools/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-acme:/letsencrypt
    ports:
      - "${TLS_HTTP_PORT:-80}:80"
      - "${TLS_HTTPS_PORT:-443}:443"

volumes:
  traefik-acme:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
